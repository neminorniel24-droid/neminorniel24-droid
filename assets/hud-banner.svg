<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CDFE8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4CDFE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="160" fill="#0B1120"/>

  <!-- quiet centered pulse ring -->
  <g transform="translate(450 80)">
    <circle r="34" fill="url(#glow)"/>
    <circle r="26" fill="none" stroke="#4CDFE8" stroke-width="1.2" opacity="0.8">
      <animate attributeName="r" values="24;30;24" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#4CDFE8">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- small spider on a single thread, top-right corner -->
  <g transform="translate(846 0)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#2A3B54" stroke-width="1"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,10; 0,46; 0,10" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <g fill="#6B8299">
        <ellipse cx="0" cy="0" rx="4" ry="3.2"/>
        <circle cx="0" cy="-4.5" r="2.2"/>
        <line x1="-4" y1="-1" x2="-8" y2="-4" stroke="#6B8299" stroke-width="0.8"/>
        <line x1="-4" y1="1" x2="-8" y2="3" stroke="#6B8299" stroke-width="0.8"/>
        <line x1="-3" y1="2.5" x2="-6" y2="6" stroke="#6B8299" stroke-width="0.8"/>
        <line x1="4" y1="-1" x2="8" y2="-4" stroke="#6B8299" stroke-width="0.8"/>
        <line x1="4" y1="1" x2="8" y2="3" stroke="#6B8299" stroke-width="0.8"/>
        <line x1="3" y1="2.5" x2="6" y2="6" stroke="#6B8299" stroke-width="0.8"/>
      </g>
    </g>
  </g>
</svg>
