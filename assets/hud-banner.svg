<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CDFE8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4CDFE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="170" fill="#0B1120"/>

  <!-- faint starfield -->
  <g fill="#3A4C68">
    <circle cx="70" cy="30" r="1"/>
    <circle cx="160" cy="70" r="1.2"/>
    <circle cx="120" cy="120" r="0.8"/>
    <circle cx="260" cy="40" r="1"/>
    <circle cx="700" cy="35" r="1"/>
    <circle cx="770" cy="90" r="1.2"/>
    <circle cx="640" cy="120" r="0.8"/>
    <circle cx="820" cy="110" r="1"/>
    <circle cx="40" cy="140" r="0.8"/>
    <circle cx="500" cy="25" r="0.8"/>
  </g>

  <!-- centered reactor: pulse + slow rotating ring -->
  <g transform="translate(450 85)">
    <circle r="36" fill="url(#glow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      <circle r="27" fill="none" stroke="#4CDFE8" stroke-width="1.3" stroke-dasharray="10 6 10 6 10 40" opacity="0.85"/>
    </g>
    <circle r="18" fill="none" stroke="#233650" stroke-width="1"/>
    <circle r="5" fill="#4CDFE8">
      <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- small spider on a single thread, top-right, larger + higher contrast -->
  <g transform="translate(818 0)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#3A4C68" stroke-width="1"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,14; 0,54; 0,14" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <g fill="#8FE3EA">
        <ellipse cx="0" cy="0" rx="5.5" ry="4.4"/>
        <circle cx="0" cy="-6" r="3"/>
        <line x1="-5" y1="-1.5" x2="-11" y2="-5.5" stroke="#8FE3EA" stroke-width="1"/>
        <line x1="-5.5" y1="1" x2="-11.5" y2="4" stroke="#8FE3EA" stroke-width="1"/>
        <line x1="-4" y1="3.5" x2="-8" y2="8" stroke="#8FE3EA" stroke-width="1"/>
        <line x1="5" y1="-1.5" x2="11" y2="-5.5" stroke="#8FE3EA" stroke-width="1"/>
        <line x1="5.5" y1="1" x2="11.5" y2="4" stroke="#8FE3EA" stroke-width="1"/>
        <line x1="4" y1="3.5" x2="8" y2="8" stroke="#8FE3EA" stroke-width="1"/>
      </g>
    </g>
  </g>
</svg>
