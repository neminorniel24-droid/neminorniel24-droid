<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#0d0f1a"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="fLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d62828" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f2b705"/>
      <stop offset="100%" stop-color="#d62828" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="120" fill="url(#fbg)"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fLine)" opacity="0.7"/>

  <circle cx="450" cy="34" r="3" fill="#f2b705">
    <animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="72" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#9fb3c8" opacity="0">
    systems online · thanks for stopping by
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="1s" fill="freeze"/>
  </text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#5b6b80" opacity="0">
    LET'S BUILD SOMETHING WORTH SHIPPING
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="1s" fill="freeze"/>
  </text>
</svg>
