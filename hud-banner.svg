<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CDFE8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#4CDFE8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4CDFE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#0B1120" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CDFE8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4CDFE8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4CDFE8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" fill="#0B1120"/>

  <!-- faint grid -->
  <g stroke="#152238" stroke-width="1">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="150" y1="0" x2="150" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
  </g>

  <!-- radar sweep band -->
  <rect x="-300" y="0" width="300" height="280" fill="url(#sweep)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- web / plexus network with flowing energy -->
  <g stroke-width="1" fill="none">
    <path id="w1" d="M40,30 L220,90 L140,200 L40,30" stroke="#1E2E45"/>
    <path id="w2" d="M220,90 L380,40 L450,140 L220,90" stroke="#1E2E45"/>
    <path id="w3" d="M450,140 L620,50 L700,150 L450,140" stroke="#1E2E45"/>
    <path id="w4" d="M700,150 L860,60 L880,200 L700,150" stroke="#1E2E45"/>
    <path id="w5" d="M140,200 L330,240 L450,140" stroke="#1E2E45"/>
    <path id="w6" d="M330,240 L600,230 L700,150" stroke="#1E2E45"/>

    <path d="M40,30 L220,90 L140,200 L40,30" stroke="#4CDFE8" stroke-dasharray="6 500" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-506" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M450,140 L620,50 L700,150 L450,140" stroke="#FFB454" stroke-dasharray="6 500" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-506" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M330,240 L600,230 L700,150" stroke="#9B8CFF" stroke-dasharray="6 350" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-356" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#4CDFE8">
    <circle cx="220" cy="90" r="2.4"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="150" r="2.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="200" r="2" fill="#FFB454"><animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="2" fill="#FFB454"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shockwave pulses from core -->
  <g transform="translate(450 140)">
    <circle r="20" fill="none" stroke="#4CDFE8" stroke-width="1.5">
      <animate attributeName="r" values="20;110" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="none" stroke="#4CDFE8" stroke-width="1.5">
      <animate attributeName="r" values="20;110" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting particles -->
  <g transform="translate(450 140)">
    <circle r="3" fill="#4CDFE8">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 92,0 A 92,92 0 1,1 -92,0 A 92,92 0 1,1 92,0"/>
    </circle>
    <circle r="2.4" fill="#FFB454">
      <animateMotion dur="9s" repeatCount="indefinite" path="M -92,0 A 92,92 0 1,1 92,0 A 92,92 0 1,1 -92,0"/>
    </circle>
    <ellipse rx="120" ry="46" fill="none" stroke="#233650" stroke-width="0.6" transform="rotate(-18)"/>
    <circle r="2.2" fill="#9B8CFF">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M 0,0 m -120,0 a 120,46 -18 1,0 240,0 a 120,46 -18 1,0 -240,0"/>
    </circle>
  </g>

  <!-- arc reactor core -->
  <g transform="translate(450 140)">
    <circle r="76" fill="url(#core)"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle r="62" fill="none" stroke="#4CDFE8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="24 8 24 8 24 96"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      <circle r="47" fill="none" stroke="#FFB454" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 10 14 10 14 82"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/>
      <circle r="33" fill="none" stroke="#9B8CFF" stroke-width="1.5" stroke-dasharray="6 6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
      <polygon points="0,-95 8,-88 0,-81 -8,-88" fill="#4CDFE8" opacity="0.85"/>
      <polygon points="95,0 88,8 81,0 88,-8" fill="#FFB454" opacity="0.85"/>
      <polygon points="0,95 -8,88 0,81 8,88" fill="#4CDFE8" opacity="0.85"/>
      <polygon points="-95,0 -88,-8 -81,0 -88,8" fill="#FFB454" opacity="0.85"/>
    </g>

    <circle r="17" fill="#0B1120" stroke="#4CDFE8" stroke-width="1.5"/>
    <circle r="6.5" fill="#4CDFE8">
      <animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="900" height="280" fill="url(#vign)"/>
</svg>
